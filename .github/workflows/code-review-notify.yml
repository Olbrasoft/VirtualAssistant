name: Code Review Notification

on:
  workflow_run:
    workflows: ["Copilot code review"]
    types: [completed]

jobs:
  notify:
    runs-on: self-hosted

    steps:
      - name: Notify Claude Code about review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENTS_DIR="$HOME/.config/claude-channels/deploy-events"
          mkdir -p "$EVENTS_DIR"

          REPO="${{ github.repository }}"
          REPO_FILE=$(echo "$REPO" | tr '/' '-')

          # Get the PR number from the workflow run
          # The Copilot code review workflow runs on a PR branch
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"

          # Find the PR for this branch
          PR_NUM=$(gh pr list --repo "$REPO" --head "$HEAD_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUM" ]; then
            echo "No open PR found for branch $HEAD_BRANCH, skipping notification"
            exit 0
          fi

          PR_TITLE=$(gh pr view "$PR_NUM" --repo "$REPO" --json title --jq '.title' 2>/dev/null || echo "unknown")
          PR_URL=$(gh pr view "$PR_NUM" --repo "$REPO" --json url --jq '.url' 2>/dev/null || echo "")
          COMMENT_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUM}/comments" --jq 'length' 2>/dev/null || echo "0")
          REVIEWER=$(gh api "repos/${REPO}/pulls/${PR_NUM}/reviews" --jq '.[-1].user.login // "Copilot"' 2>/dev/null || echo "Copilot")

          cat > "$EVENTS_DIR/${REPO_FILE}-review-${PR_NUM}.json" << REVIEW_EOF
          {
            "event": "code-review-complete",
            "status": "${CONCLUSION}",
            "repository": "${REPO}",
            "prNumber": ${PR_NUM},
            "prTitle": $(echo "${PR_TITLE}" | jq -Rs .),
            "prUrl": "${PR_URL}",
            "commit": "${HEAD_SHA:0:7}",
            "reviewer": "${REVIEWER}",
            "reviewComments": ${COMMENT_COUNT},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          REVIEW_EOF

          echo "Code review notification written for PR #${PR_NUM} (reviewer: ${REVIEWER}, conclusion: ${CONCLUSION}, comments: ${COMMENT_COUNT})"
