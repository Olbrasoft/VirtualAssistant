name: Code Review Notification

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    runs-on: self-hosted

    steps:
      - name: Notify Claude Code about review
        run: |
          EVENTS_DIR="$HOME/.config/claude-channels/deploy-events"
          mkdir -p "$EVENTS_DIR"

          PR_NUM="${{ github.event.pull_request.number }}"
          REVIEWER="${{ github.event.review.user.login }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          REPO="${{ github.repository }}"
          REPO_FILE=$(echo "$REPO" | tr '/' '-')

          # Get review comment count
          COMMENT_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUM}/comments" --jq 'length' 2>/dev/null || echo "0")

          COMMIT_SHA=$(gh pr view "$PR_NUM" --repo "$REPO" --json headRefOid --jq '.headRefOid' 2>/dev/null | head -c 7)
          PR_TITLE=$(gh pr view "$PR_NUM" --repo "$REPO" --json title --jq '.title' 2>/dev/null || echo "unknown")
          PR_URL="${{ github.event.pull_request.html_url }}"

          cat > "$EVENTS_DIR/${REPO_FILE}.json" << REVIEW_EOF
          {
            "event": "code-review-complete",
            "status": "${REVIEW_STATE}",
            "repository": "${REPO}",
            "prNumber": ${PR_NUM},
            "prTitle": $(echo "${PR_TITLE}" | jq -Rs .),
            "prUrl": "${PR_URL}",
            "commit": "${COMMIT_SHA}",
            "reviewer": "${REVIEWER}",
            "reviewComments": ${COMMENT_COUNT},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          REVIEW_EOF

          echo "Code review notification written (reviewer: ${REVIEWER}, state: ${REVIEW_STATE}, comments: ${COMMENT_COUNT})"
