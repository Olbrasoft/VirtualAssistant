name: Code Review Notification

on:
  pull_request_review:
    types: [submitted]

jobs:
  notify:
    runs-on: self-hosted

    steps:
      - name: Notify Claude Code about review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EVENTS_DIR="$HOME/.config/claude-channels/deploy-events"
          mkdir -p "$EVENTS_DIR"

          PR_NUM="${{ github.event.pull_request.number }}"
          REVIEW_ID="${{ github.event.review.id }}"
          REVIEWER="${{ github.event.review.user.login }}"
          REVIEW_STATE="${{ github.event.review.state }}"
          REPO="${{ github.repository }}"
          REPO_FILE=$(echo "$REPO" | tr '/' '-')

          # Use payload data directly instead of gh pr view calls
          COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
          COMMIT_SHA="${COMMIT_SHA:0:7}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"

          # Get inline comment count for this specific review
          COMMENT_COUNT=$(gh api "repos/${REPO}/pulls/${PR_NUM}/reviews/${REVIEW_ID}/comments" --jq 'length' 2>/dev/null || echo "0")

          # Use unique filename: event type + PR number (avoids overwriting deploy events)
          cat > "$EVENTS_DIR/${REPO_FILE}-review-${PR_NUM}.json" << REVIEW_EOF
          {
            "event": "code-review-complete",
            "status": "${REVIEW_STATE}",
            "repository": "${REPO}",
            "prNumber": ${PR_NUM},
            "prTitle": $(echo "${PR_TITLE}" | jq -Rs .),
            "prUrl": "${PR_URL}",
            "commit": "${COMMIT_SHA}",
            "reviewer": "${REVIEWER}",
            "reviewComments": ${COMMENT_COUNT},
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          REVIEW_EOF

          echo "Code review notification written (reviewer: ${REVIEWER}, state: ${REVIEW_STATE}, comments: ${COMMENT_COUNT})"
