name: Deploy VirtualAssistant

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout VirtualAssistant
        uses: actions/checkout@v4
        with:
          path: VirtualAssistant
          persist-credentials: false
          set-safe-directory: false

      - name: Checkout Data dependency
        uses: actions/checkout@v4
        with:
          repository: Olbrasoft/Data
          path: Data
          persist-credentials: false
          set-safe-directory: false

      # .NET 10 is already installed system-wide on the self-hosted runner
      - name: Verify .NET version
        id: dotnet-version
        run: dotnet --version

      - name: Restore dependencies
        id: restore
        working-directory: VirtualAssistant
        run: dotnet restore

      - name: Build
        id: build
        working-directory: VirtualAssistant
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        id: test
        working-directory: VirtualAssistant
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName!~IntegrationTests"

      - name: Publish
        id: publish
        working-directory: VirtualAssistant
        run: |
          # Read deploy path from systemd service WorkingDirectory (SINGLE SOURCE OF TRUTH)
          DEPLOY_PATH=$(grep "^WorkingDirectory=" deploy/virtual-assistant.service | cut -d'=' -f2)
          echo "Deploying to: $DEPLOY_PATH"

          dotnet publish src/VirtualAssistant.Service/VirtualAssistant.Service.csproj \
            -c Release \
            -o "$DEPLOY_PATH" \
            --no-self-contained

      - name: Copy assets (icons and sounds)
        id: copy-assets
        run: |
          # Read deploy path from systemd service
          DEPLOY_PATH=$(grep "^WorkingDirectory=" VirtualAssistant/deploy/virtual-assistant.service | cut -d'=' -f2)

          # Source path for assets (from working directory, not Git checkout)
          ASSETS_SOURCE="/home/jirka/Olbrasoft/VirtualAssistant/assets"

          # Copy icons to parent of DEPLOY_PATH
          # WorkingDirectory (DEPLOY_PATH) = /opt/olbrasoft/virtual-assistant/app
          # Icons are in /opt/olbrasoft/virtual-assistant/icons (parent directory)
          ICONS_PATH="$(dirname "$DEPLOY_PATH")/icons"
          echo "Copying icons from: $ASSETS_SOURCE/icons"
          echo "Copying icons to: $ICONS_PATH"
          mkdir -p "$ICONS_PATH"
          cp -r "$ASSETS_SOURCE/icons/"* "$ICONS_PATH/" || true

          # Copy sounds to parent of DEPLOY_PATH (code uses AppContext.BaseDirectory/../sounds)
          # WorkingDirectory (DEPLOY_PATH) = /opt/olbrasoft/virtual-assistant/app
          # AppContext.BaseDirectory = /opt/olbrasoft/virtual-assistant/app/
          # AppContext.BaseDirectory/../sounds = /opt/olbrasoft/virtual-assistant/sounds/
          SOUNDS_PATH="$(dirname "$DEPLOY_PATH")/sounds"
          echo "Copying sounds from: $ASSETS_SOURCE/sounds"
          echo "Copying sounds to: $SOUNDS_PATH"
          mkdir -p "$SOUNDS_PATH"
          cp -r "$ASSETS_SOURCE/sounds/"* "$SOUNDS_PATH/" || true

          echo "Assets copied successfully from working directory"

      - name: Restart service
        id: restart
        run: |
          # GitHub Actions runner doesn't have D-Bus session, so we need to set it up
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user restart virtual-assistant.service
          sleep 2
          systemctl --user status virtual-assistant.service --no-pager

      - name: Verify health
        id: health
        run: |
          # Wait for service to be ready
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5055/health > /dev/null 2>&1; then
              echo "Health check passed"
              break
            fi
            echo "Waiting for service to start... ($i/10)"
            sleep 2
          done

      - name: Notify Claude Code
        if: always()
        run: |
          EVENTS_DIR="$HOME/.config/claude-channels/deploy-events"
          mkdir -p "$EVENTS_DIR"

          COMMIT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_MSG=$(git -C VirtualAssistant log -1 --pretty=%s 2>/dev/null || echo "unknown")
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          REPO_FILE=$(echo "$GITHUB_REPOSITORY" | tr '/' '-')

          # Determine which step failed (if any)
          # Note: bracket notation required for hyphenated step IDs
          FAILED_STEP=""
          if [ "${{ steps.restore.outcome }}" = "failure" ]; then
            FAILED_STEP="restore"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            FAILED_STEP="build"
          elif [ "${{ steps.test.outcome }}" = "failure" ]; then
            FAILED_STEP="test"
          elif [ "${{ steps.publish.outcome }}" = "failure" ]; then
            FAILED_STEP="publish"
          elif [ "${{ steps['copy-assets'].outcome }}" = "failure" ]; then
            FAILED_STEP="copy-assets"
          elif [ "${{ steps.restart.outcome }}" = "failure" ]; then
            FAILED_STEP="restart"
          elif [ "${{ steps.health.outcome }}" = "failure" ]; then
            FAILED_STEP="health"
          fi

          # Treat anything other than job.status == "success" as a failure,
          # so cancelled or timed-out jobs don't masquerade as deploy-complete
          # just because FAILED_STEP happened to be empty.
          DEPLOY_SUCCEEDED=false
          if [ "${{ job.status }}" = "success" ] && [ -z "$FAILED_STEP" ]; then
            DEPLOY_SUCCEEDED=true
          fi

          # Event JSON is kept as an audit artifact on the runner host — one
          # file per (repo, commit, run, attempt) tuple, so concurrent deploys,
          # re-runs, and dispatches of the same SHA each get a unique record.
          # Nothing actively consumes these files anymore; the live wake is
          # delivered via the ghnotify CLI below.
          EVENT_FILE="$EVENTS_DIR/${REPO_FILE}-deploy-${COMMIT_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          if [ "$DEPLOY_SUCCEEDED" = true ]; then
            EVENT_NAME="deploy-complete"
          else
            EVENT_NAME="deploy-failure"
          fi
          jq -n \
            --arg event "$EVENT_NAME" \
            --arg status "${{ job.status }}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${COMMIT_SHA}" \
            --arg commitMessage "${COMMIT_MSG}" \
            --arg runUrl "${RUN_URL}" \
            --arg environment "production" \
            --arg failedStep "${FAILED_STEP}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event: $event, status: $status, repository: $repository, commit: $commit, commitMessage: $commitMessage, runUrl: $runUrl, environment: $environment, failedStep: $failedStep, timestamp: $timestamp}' \
            > "$EVENT_FILE"

          echo "Deploy event written to $EVENT_FILE"
          if [ -n "$FAILED_STEP" ]; then
            echo "Failed step: $FAILED_STEP"
          fi

          # Wake the Claude Code session for this repo via the ghnotify CLI.
          # The legacy `~/.claude/hooks/wake-claude.sh` FIFO path was removed
          # in the ghnotify migration; this workflow still runs on the same
          # self-hosted machine as the ghnotify binary, so invoking the CLI
          # directly is the simplest single-source-of-truth wake.
          #
          # Pass the fully-qualified owner/repo ($GITHUB_REPOSITORY) so routing
          # cannot collide across orgs that happen to share a short repo name.
          if [ "$DEPLOY_SUCCEEDED" = true ]; then
            WAKE_PROMPT="ghnotify deploy-complete: repo=${GITHUB_REPOSITORY} status=${{ job.status }} commit=${COMMIT_SHA} run_url=${RUN_URL} | next: deploy SUCCEEDED. Verify service: curl -sf http://localhost:5055/health. If health OK and the change is user-visible, confirm visually (Playwright or manual spot-check) before closing the underlying issue. If health fails, the previous build may still be running — check 'systemctl --user status virtual-assistant.service'."
          else
            WAKE_PROMPT="ghnotify deploy-failure: repo=${GITHUB_REPOSITORY} status=${{ job.status }} commit=${COMMIT_SHA} failed_step=${FAILED_STEP:-unknown} run_url=${RUN_URL} | next: deploy FAILED (job.status=${{ job.status }}${FAILED_STEP:+, failed step: $FAILED_STEP}). Read the run logs at ${RUN_URL}, diagnose, fix on main or a hotfix branch, push. Service may still be serving the previous build — verify http://localhost:5055/health before trusting the current state."
          fi
          # GitHub Actions on self-hosted runners inherit a minimal PATH
          # that does NOT include `~/.cargo/bin` where `cargo install` puts
          # the ghnotify binary. Prepend the common install locations so
          # `command -v ghnotify` can actually find it; the `command -v`
          # lookup honors the current process PATH only, so exporting here
          # (rather than trying to source ~/.bashrc — unreliable under
          # non-interactive runners) is the robust approach.
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          if command -v ghnotify > /dev/null 2>&1; then
            # Pass --commit so ghnotify can resolve the PR-author UUID
            # via `gh api commits/SHA/pulls` and route to the session
            # that opened the PR. Without it, ghnotify falls back to
            # repo-name routing (`claude-VirtualAssistant-*`), which
            # silently fails on machines whose tmux sessions follow a
            # different naming convention (e.g. `claude-<user>-<tty>`).
            # That failure mode lost the wake for run #456 on
            # 2026-05-02 even though the deploy itself succeeded.
            #
            # Use the full $GITHUB_SHA, NOT the short $COMMIT_SHA
            # (defined above as ${GITHUB_SHA:0:7} for filenames/log
            # display). The commits/SHA/pulls endpoint is unreliable
            # with abbreviated SHAs — short SHAs can be ambiguous
            # across the repo's history.
            ghnotify send \
              --repo "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA" \
              --prompt "$WAKE_PROMPT" || \
              echo "ghnotify send failed; wake not delivered" >&2
          else
            echo "ghnotify CLI not found on PATH (looked in: $PATH) — install via 'cargo install --path /home/jirka/Olbrasoft/ghnotify'" >&2
          fi
