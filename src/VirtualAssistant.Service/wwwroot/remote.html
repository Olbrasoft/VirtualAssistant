<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#007bff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Diktování">
    <title>VirtualAssistant Remote</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            padding-top: 30px;
            color: #e0e0e0;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
                padding-top: 8px;
            }
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 12px;
        }

        .btn {
            padding: 20px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-toggle {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            color: white;
            padding: 50px 40px;
            font-size: 1.6rem;
        }

        .btn-toggle:hover:not(:disabled) {
            background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
        }

        .btn-toggle.recording {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
        }

        .btn-toggle.recording:hover:not(:disabled) {
            background: linear-gradient(135deg, #d32f2f 0%, #c62828 100%);
        }

        .btn-toggle.transcribing {
            background: linear-gradient(135deg, #ffd700 0%, #ffb900 100%);
            color: #000;
        }

        .btn-toggle.transcribing:hover:not(:disabled) {
            background: linear-gradient(135deg, #ffb900 0%, #ff9800 100%);
        }

        .btn-enter {
            background: linear-gradient(135deg, #4caf50 0%, #45a049 100%);
            color: white;
            padding: 35px 40px;
            font-size: 1.3rem;
        }

        .btn-enter:hover:not(:disabled) {
            background: linear-gradient(135deg, #45a049 0%, #3d9142 100%);
        }

        .btn-clear {
            background: linear-gradient(135deg, #ff9800 0%, #f57c00 100%);
            color: white;
            padding: 25px 40px;
            font-size: 1.1rem;
        }

        .btn-clear:hover:not(:disabled) {
            background: linear-gradient(135deg, #f57c00 0%, #ef6c00 100%);
        }

        .transcription-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            min-height: 100px;
            text-align: left;
        }

        .transcription-box h3 {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .transcription-text {
            font-size: 1rem;
            line-height: 1.5;
            color: #fff;
            word-wrap: break-word;
        }

        .transcription-text.empty {
            color: #666;
            font-style: italic;
        }

        .btn-paste {
            margin-top: 12px;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(135deg, #7c4dff 0%, #651fff 100%);
            color: white;
            width: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-paste:active {
            transform: scale(0.95);
        }

        .btn-paste:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-paste.visible {
            display: flex;
        }

        .connection-status {
            position: fixed;
            top: calc(env(safe-area-inset-top) + 2px);
            right: 8px;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.65rem;
            background: rgba(0,0,0,0.5);
        }

        .connection-status.connected {
            color: #4caf50;
        }

        .connection-status.disconnected {
            color: #f44336;
        }

        .icon {
            font-size: 1.2em;
            font-weight: bold;
            vertical-align: middle;
        }

        .app-launchers {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn-app {
            flex: 1;
            background: linear-gradient(135deg, #37474f 0%, #263238 100%);
            color: white;
            padding: 20px 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-app:active {
            transform: scale(0.95);
        }

        .btn-app:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-app:hover:not(:disabled) {
            background: linear-gradient(135deg, #455a64 0%, #37474f 100%);
        }

        .btn-app svg {
            width: 32px;
            height: 32px;
        }

        .workspace-section {
            margin-bottom: 12px;
        }

        .workspace-buttons {
            display: flex;
            gap: 10px;
        }

        .btn-workspace {
            flex: 1;
            height: 70px;
            font-size: 1.5rem;
            font-weight: 700;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: linear-gradient(135deg, #37474f 0%, #263238 100%);
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-workspace:active {
            transform: scale(0.95);
        }

        .btn-workspace:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-workspace:hover:not(:disabled) {
            background: linear-gradient(135deg, #455a64 0%, #37474f 100%);
        }

        .btn-workspace.active {
            background: linear-gradient(135deg, #2196f3 0%, #1976d2 100%);
            border-color: #64b5f6;
            color: white;
        }

        .btn-workspace.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="connection-status disconnected" id="connectionStatus">Odpojeno</div>

    <div class="container">
        <div class="controls">
            <button class="btn btn-toggle" id="btnToggle" disabled>
                <span class="icon" id="toggleIcon">&#x25CF;</span>
                <span id="toggleText">Diktovat</span>
            </button>

            <button class="btn btn-enter" id="btnEnter" disabled>
                <span class="icon">&#x21B5;</span>
                Enter
            </button>

            <button class="btn btn-clear" id="btnClear" disabled>
                <span class="icon">&#x2715;</span>
                Smazat
            </button>
        </div>

        <div class="workspace-section" id="workspaceSection">
            <div class="workspace-buttons">
                <button class="btn-workspace" id="btnWorkspace1" data-workspace="1" disabled>1</button>
                <button class="btn-workspace hidden" id="btnWorkspace4" data-workspace="4" disabled>4</button>
                <button class="btn-workspace hidden" id="btnWorkspace5" data-workspace="5" disabled>5</button>
                <button class="btn-workspace hidden" id="btnWorkspace6" data-workspace="6" disabled>6</button>
            </div>
        </div>

        <div class="app-launchers">
            <button class="btn-app" id="btnDiscord" disabled>
                <svg viewBox="0 -28.5 256 256" xmlns="http://www.w3.org/2000/svg" fill="white">
                    <path d="M216.856 16.597A208.502 208.502 0 0 0 164.042 0c-2.275 4.113-4.933 9.645-6.766 14.046-19.692-2.961-39.203-2.961-58.533 0-1.832-4.4-4.55-9.933-6.846-14.046a207.809 207.809 0 0 0-52.855 16.638C5.618 67.147-3.443 116.4 1.087 164.956c22.169 16.555 43.653 26.612 64.775 33.193A161.094 161.094 0 0 0 79.735 175.3a136.413 136.413 0 0 1-21.846-10.632 108.636 108.636 0 0 0 5.356-4.237c42.122 19.702 87.89 19.702 129.51 0a131.66 131.66 0 0 0 5.355 4.237 136.07 136.07 0 0 1-21.886 10.653c4.006 8.02 8.638 15.67 13.873 22.848 21.142-6.58 42.646-16.637 64.815-33.213 5.316-56.288-9.08-105.09-38.056-148.36ZM85.474 135.095c-12.645 0-23.015-11.805-23.015-26.18s10.149-26.2 23.015-26.2c12.867 0 23.236 11.825 23.015 26.2.02 14.375-10.148 26.18-23.015 26.18Zm85.051 0c-12.645 0-23.014-11.805-23.014-26.18s10.148-26.2 23.014-26.2c12.867 0 23.236 11.825 23.015 26.2 0 14.375-10.148 26.18-23.015 26.18Z"/>
                </svg>
                <span class="app-label">Discord</span>
            </button>
            <button class="btn-app" id="btnFerdium" disabled>
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" fill="white">
                    <circle cx="50" cy="42" r="28" fill="none" stroke="white" stroke-width="5"/>
                    <circle cx="38" cy="35" r="4"/>
                    <circle cx="62" cy="35" r="4"/>
                    <path d="M30 55 Q32 70 50 72 Q68 70 70 55" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <path d="M18 42 Q10 38 5 45" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <path d="M82 42 Q90 38 95 45" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <path d="M15 50 Q8 48 4 55" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <path d="M85 50 Q92 48 96 55" fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <span class="app-label">Ferdium</span>
            </button>
        </div>

        <div class="transcription-box">
            <h3>Poslední přepis</h3>
            <div class="transcription-text empty" id="transcriptionText">Žádný přepis</div>
            <button class="btn-paste" id="btnPaste" disabled>
                <span>&#x1F4CB;</span> Vložit
            </button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="remote.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => {
                    console.log('Service Worker registered:', reg);
                    return reg.update();
                })
                .catch(err => console.error('Service Worker error:', err));
        }
    </script>
</body>
</html>
